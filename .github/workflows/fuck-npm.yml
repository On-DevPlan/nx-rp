# 兜底发布：npm 主账号（flowot）被封时的备用流水线。
#
# 与主工作流（npm-publish.yml）的差异只有两处：
#   1. 包名：package.json 的 name 必须以 flowot6 为前缀（npm 包名全局唯一，
#      nx-rp 被主账号占用，小号只能发 flowot6-nx-rp 这类名字）
#   2. 身份：仓库 secret NPM_TOKEN 存的是 flowot6 的 token
#
# 触发：push 到 main（与主仓库同款习惯），也可 workflow_dispatch 手动跑。
#
# 包名守门（gate step）：包名不是 flowot6 前缀时，后续所有 step 一律 skip——
# run 显示绿勾 + 跳过标记，不红。主流水线（npm-publish.yml）负责 nx-rp 包名；
# 本流水线只在包名迁回 flowot6 命名空间时才实际干活。
name: fuck-npm (fallback publish)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 需要
  id-token: write   # --provenance 签名需要（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 守门：必须在任何安装/构建之前 ──
      # 输出 ok=true/false；后续所有 step 挂 if: needs.gate 判断。
      # 注意不能用 job 级 if——它在 checkout 之前跑，读不到 package.json。
      - name: 守门：包名必须是 flowot6 前缀（否则本流水线无事可做）
        id: gate
        run: |
          name=$(node -p "require('./package.json').name")
          case "$name" in
            flowot6-*)
              echo "ok=true" >> $GITHUB_OUTPUT
              echo "包名合规: $name——进入兜底发布流程"
              ;;
            *)
              echo "ok=false" >> $GITHUB_OUTPUT
              echo "包名 $name 归主流水线（npm-publish.yml）发，本兜底流水线跳过（不红，绿勾+skip）"
              ;;
          esac

      - name: 读版本号与包名
        if: steps.gate.outputs.ok == 'true'
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "tag=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # 幂等检查提到构建前——包已发过时连 install/build/test 都不用跑
      - name: 已存在则跳过（幂等，与主工作流同款）
        if: steps.gate.outputs.ok == 'true'
        id: check
        run: |
          if git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
          if npm view ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} version >/dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.published == 'false'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.published == 'false'
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.published == 'false'
      - run: pnpm run build
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.published == 'false'
      - run: pnpm test
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.published == 'false'

      - name: 打 tag
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.tag_exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: 发布
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
